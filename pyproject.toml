[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "async-payment-processing"
version = "0.1.0"
description = "Async payment processing service with FastAPI, PostgreSQL, RabbitMQ and outbox delivery."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.2",
    "asyncpg>=0.29.0",
    "fastapi>=0.111.0",
    "faststream[rabbit]>=0.5.18",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.3.4",
    "SQLAlchemy>=2.0.31",
    "uvicorn[standard]>=0.30.1",
]

[tool.setuptools.packages.find]
include = ["app*"]
